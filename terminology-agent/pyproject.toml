[project]
name = "terminology-agent"
version = "0.1.0"
description = "Terminology Learning Agent — LangGraph workflow for i18n translation review system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langsmith>=0.1.0",
    "sqlalchemy>=2.0.50",
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ipython>=8.0.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["app.*.tests*", "app.testing*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "unit: 纯函数，无 IO",
    "service: Service 层，Mock Repo",
    "api: FastAPI 端点",
    "graph: LangGraph 工作流",
]
