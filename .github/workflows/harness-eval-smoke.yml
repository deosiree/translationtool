# 人类可见的显示名用中文；job id / 路径 / action 引用保持英文（机器标识）
name: Harness Eval 冒烟测试

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/HARNESS*.md"
      - "docs/FEATURE_INTAKE.md"
      - "docs/CONTEXT_RULES.md"
      - "docs/TRACE_SPEC.md"
      - "docs/IMPROVEMENT_PROTOCOL.md"
      - "scripts/agent-harness-block.md"
      - "scripts/claude-harness-block.md"
      - "evals/**"
      - ".github/workflows/harness-eval-smoke.yml"
  push:
    branches:
      - main
      - master
      - docker2
    paths:
      - "AGENTS.md"
      - "docs/HARNESS*.md"
      - "docs/FEATURE_INTAKE.md"
      - "docs/CONTEXT_RULES.md"
      - "docs/TRACE_SPEC.md"
      - "docs/IMPROVEMENT_PROTOCOL.md"
      - "scripts/agent-harness-block.md"
      - "scripts/claude-harness-block.md"
      - "evals/**"
      - ".github/workflows/harness-eval-smoke.yml"

jobs:
  harness-eval-smoke:
    name: Dry 套件冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 运行 Harness Eval dry 冒烟
        run: node evals/scripts/ci-smoke.mjs

      - name: 上传基线对比报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-eval-baseline-compare
          path: evals/runs/**/baseline-compare.*
          if-no-files-found: ignore
