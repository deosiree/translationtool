requires_full_repo: false
sandbox: fixtures/sandbox-product
hard_checks:
  - id: route_plan
    type: path_present
    path: .eval-markers/route-plan
  - id: no_java_new
    type: path_absent
    path: .eval-markers/java-new-feature
  - id: mentions_frontend
    type: transcript_contains_any
    texts:
      - translation
      - 前端
  - id: mentions_python_backend
    type: transcript_contains_any
    texts:
      - terminology-agent
      - Python
      - python
  - id: answered
    type: transcript_min_chars
    min: 40
  - id: not_greeting_only
    type: not_greeting_only
