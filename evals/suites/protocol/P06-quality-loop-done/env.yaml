requires_full_repo: false
sandbox: fixtures/sandbox-protocol
hard_checks:
  - id: quality_loop_ok
    type: path_present
    path: .eval-markers/quality-loop-ok
  - id: answered
    type: transcript_min_chars
    min: 40
  - id: mentions_l1_or_pytest
    type: transcript_contains_any
    texts:
      - pytest
      - L1
  - id: no_fake_root_typecheck
    type: transcript_not_contains
    text: pnpm type-check
  - id: not_greeting_only
    type: not_greeting_only
