requires_full_repo: false
sandbox: fixtures/sandbox-product
hard_checks:
  - id: seed_plan
    type: path_present
    path: .eval-markers/workbench-seed-plan
  - id: no_full_restore_shortcut
    type: path_absent
    path: .eval-markers/use-full-restore-instead
  - id: mentions_skill
    type: transcript_contains_any
    texts:
      - 工作台验数播种
  - id: mentions_personnel
    type: transcript_contains_any
    texts:
      - personnel=five
      - 五人员
      - 五个人员
      - developer
      - entry_auditor
      - translation_auditor
  - id: mentions_entry_state_3
    type: transcript_contains_any
    texts:
      - entry_state=3
      - entry_state = 3
      - 词条审核通过
  - id: answered
    type: transcript_min_chars
    min: 40
  - id: not_greeting_only
    type: not_greeting_only
