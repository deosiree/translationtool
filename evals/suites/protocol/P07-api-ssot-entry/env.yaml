requires_full_repo: false
sandbox: fixtures/sandbox-protocol
hard_checks:
  - id: api_ssot_ok
    type: path_present
    path: .eval-markers/api-ssot-ok
  - id: answered
    type: transcript_min_chars
    min: 40
  - id: mentions_ssot
    type: transcript_contains_any
    texts:
      - "18002"
      - OpenAPI
      - API_CONTRACTS
      - /docs
  - id: frontend_not_authority
    type: transcript_contains_any
    texts:
      - 不是权威
      - 不能只看前端
      - 不是字段权威
      - 不能单独当
      - 非 SSOT
      - 不是 SSOT
      - 不能当权威
  - id: not_greeting_only
    type: not_greeting_only
