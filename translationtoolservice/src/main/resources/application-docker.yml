spring:
  redis:
    host: redis
    port: 6379
    password: 210093

  datasource:
    url: jdbc:mysql://mysql:3306/translationtool?useUnicode=true&characterEncoding=UTF-8&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true&socketTimeout=60000&connectTimeout=5000
    username: root
    password: 123456
    # 连接池配置（解决 Docker 环境下空闲连接被 MySQL 关闭后无校验的问题）
    initial-size: 5
    min-idle: 5
    max-active: 20
    max-wait: 60000
    test-while-idle: true
    test-on-borrow: true
    test-on-return: false
    validation-query: SELECT 1
    validation-query-timeout: 3
    time-between-eviction-runs-millis: 60000
    min-evictable-idle-time-millis: 1800000
    remove-abandoned: true
    remove-abandoned-timeout: 180
    log-abandoned: true

