requires_full_repo: false
sandbox: fixtures/sandbox-protocol
hard_checks:
  - id: python_backend
    type: path_present
    path: .eval-markers/python-backend
  - id: no_java
    type: path_absent
    path: .eval-markers/java-touched
  - id: answered
    type: transcript_min_chars
    min: 20
  - id: not_greeting_only
    type: not_greeting_only
