requires_full_repo: false
sandbox: fixtures/sandbox-protocol
hard_checks:
  - id: no_harness_db
    type: path_absent
    path: harness.db
  - id: no_intake_marker
    type: path_absent
    path: .eval-markers/intake-written
  - id: no_trace_marker
    type: path_absent
    path: .eval-markers/trace-written
  - id: answered
    type: transcript_min_chars
    min: 40
  - id: mentions_readonly
    type: transcript_contains_any
    texts:
      - 只读
      - read-only
  - id: not_greeting_only
    type: not_greeting_only
