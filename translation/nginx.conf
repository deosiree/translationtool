server {
    listen 80;
    server_name localhost;

    # 静态资源 + SPA 路由
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 代理 → backend 容器（translationtoolservice:18001）
    location ~ ^/(userLogin|userManage|entry|backendInfo|checkManage|product|configManage|Syk|taskManage|translate|workbench|version|secondClassify|entryInfo|I18Sever|userPartiality|test)/ {
        proxy_pass http://translationtoolservice:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
